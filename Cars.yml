info:
  name: Cars
  type: http
  seq: 5

http:
  method: GET
  url: https://api-wired-prod-1-euw1.wrd-aws.com/commerce/v1/accounts/{{account_id}}/vehicles?country={{country}}
  headers:
    - name: apikey
      value: "{{kamereon_apikey}}"
    - name: x-gigya-id_token
      value: "{{jwt_token}}"
  params:
    - name: country
      value: "{{country}}"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const data = res.getBody();
        bru.setVar("vin", data.vehicleLinks[0].vin);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
