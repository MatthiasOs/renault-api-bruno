info:
  name: WakeUp
  type: http
  seq: 7

http:
  method: POST
  url: https://api-wired-prod-1-euw1.wrd-aws.com/commerce/v1/accounts/{{account_id}}/kamereon/kca/car-adapter/v1/cars/{{vin}}/actions/refresh-battery-status?country={{country}}
  headers:
    - name: apikey
      value: "{{gigya_apikey}}"
    - name: x-gigya-id_token
      value: "{{jwt_token}}"
    - name: Content-Type
      value: application/vnd.api+json
  params:
    - name: country
      value: "{{country}}"
      type: query
  body:
    type: json
    data: |-
      {
        "data": {
          "type": "RefreshBatteryStatus"
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
