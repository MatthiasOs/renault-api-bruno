opencollection: 1.0.0

info:
  name: API_Renault
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

docs:
  content: |
    # Siehe [README.md](https://github.com/MatthiasOs/renault-api-bruno/blob/main/README.md) im Projekt-Root für die vollständige Dokumentation.
  type: text/markdown
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
